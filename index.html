<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Close This Tab</title>
<meta name="description" content="A browser tab that knows you want to leave. It does not take it well.">
<meta property="og:title" content="Don't Close This Tab">
<meta property="og:description" content="A browser tab that knows you want to leave. It does not take it well.">
<link id="fav" rel="icon" href="data:,">
<style>
:root{
  --bg:#f3efe6; --ink:#1d1b18; --muted:#6f685d; --line:#d8d0c2; --card:#fffdf8;
  --tab:#fffdf8; --tabline:#1d1b18; --red:#c62a1f; --mood:0;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15140f; --ink:#efe9dd; --muted:#a39b8c; --line:#3a362d; --card:#211f19; --tab:#2a2720; --tabline:#efe9dd; --red:#ff6b5e; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 50% 35%, rgba(198,42,31,calc(var(--mood)*0.07)) 0%, transparent 70%);
  color:var(--ink);font:17px/1.45 ui-serif,Georgia,"Times New Roman",serif;overflow:hidden;
  transition:filter .6s ease, background-color .6s;
}
body.elsewhere{filter:grayscale(1) brightness(.85)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:18px 16px 12px;perspective:900px}
#app.lookup .tilt{transform:rotateX(12deg) translateY(-8px)}
.tilt{transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 0;display:flex;flex-direction:column;align-items:center;width:100%;flex:1;min-height:0}
header{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
header b{color:var(--ink);font-weight:600}
.piece{transition:transform 1.1s cubic-bezier(.2,1.5,.4,1), opacity .6s}
#faceWrap{position:relative;margin-top:2vh;width:min(330px,62vw);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
#faceWrap.peek{transform:translateY(-9vh) scale(.85)}
#faceWrap.squish{animation:squish .7s ease}
@keyframes squish{0%{transform:scaleX(1)}30%{transform:scaleX(.72) scaleY(1.12)}60%{transform:scaleX(1.08) scaleY(.95)}100%{transform:none}}
#face{width:100%;height:auto;display:block;overflow:visible}
#face .tabshape{fill:var(--tab);stroke:var(--tabline);stroke-width:5;stroke-linejoin:round}
#face .eyeW{fill:#fff;stroke:var(--tabline);stroke-width:4}
#face .pupil{fill:#1d1b18;transition:r .2s}
#face .brow,#face .mouth{fill:none;stroke:var(--tabline);stroke-width:5;stroke-linecap:round;transition:d .25s}
#face .lid{fill:var(--tab);stroke:var(--tabline);stroke-width:4;transition:transform .15s}
#face .sweat{fill:#7cc4f2;opacity:0;transition:opacity .4s}
#face .bandage{fill:#e9c9a0;stroke:#a8835a;stroke-width:2}
#face .x{fill:none;stroke:var(--tabline);stroke-width:4;stroke-linecap:round}
#zzz{position:absolute;right:-14%;top:30%;font:700 28px ui-monospace,Menlo,monospace;color:var(--muted);opacity:0;transition:opacity .5s}
#faceWrap.asleep #zzz{opacity:1;animation:zz 2s ease-in-out infinite}
@keyframes zz{50%{transform:translate(6px,-8px)}}
#cobweb{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s}
#cobweb.on{opacity:.9}
#bubble{margin-top:14px;max-width:720px;min-height:3.2em;text-align:center;font-size:clamp(22px,3.6vw,34px);line-height:1.2}
#bubble.shake{animation:jit .14s linear infinite}
@keyframes jit{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
#sub{min-height:1.4em;font-size:14px;color:var(--muted);text-align:center;margin-top:4px}
#ways{margin-top:auto;width:100%;max-width:820px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:640px){#ways{grid-template-columns:repeat(2,1fr)}}
.way{background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:7px 40px 7px 9px;font-size:13px;line-height:1.25;color:var(--muted);font-style:italic;min-height:44px;position:relative}
.way.found{border:1.5px solid var(--red);color:var(--ink);font-style:normal}
.way.found::after{content:"LEFT";position:absolute;right:6px;top:4px;font:700 9px ui-monospace,monospace;letter-spacing:.12em;color:var(--red);border:1.5px solid var(--red);padding:0 3px;transform:rotate(8deg)}
.way.stamp{animation:stamp .5s cubic-bezier(.2,2,.4,1)}
@keyframes stamp{0%{transform:scale(1.6) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
#bottom{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
#bottom button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:4px 9px;font:inherit;cursor:pointer}
#bottom button:hover{color:var(--ink);border-color:var(--muted)}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,92vw);background:var(--card);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .3s;z-index:30;padding:16px;overflow:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
#drawer.open{transform:none}
#drawer h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
#log{list-style:none;margin:0;padding:0}
#log li{padding:6px 0;border-bottom:1px dashed var(--line)}
#log .n{color:var(--red);font-weight:700}
#fake{position:fixed;z-index:20;top:70px;right:22px;background:var(--ink);color:var(--bg);border:0;border-radius:5px;padding:9px 14px;font:600 14px ui-monospace,Menlo,Consolas,monospace;cursor:pointer;white-space:nowrap;touch-action:manipulation;transition:left .22s cubic-bezier(.3,1.4,.5,1),top .22s cubic-bezier(.3,1.4,.5,1),transform .3s}
#fake.tiny{transform:scale(.35)}
#fake.tired{transform:rotate(-14deg);transition:none}
#fake.decoy{opacity:.92}
#fake:focus-visible,.dlg button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.key{position:fixed;z-index:15;width:110px;height:110px;border-radius:14px;background:var(--card);border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink);display:flex;align-items:center;justify-content:center;font:700 54px ui-monospace,Menlo,monospace;pointer-events:none}
.key small{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);font:600 12px ui-monospace,monospace;white-space:nowrap;color:var(--muted)}
.key.pop{animation:pop .35s cubic-bezier(.2,2,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.key.run{transition:transform 1.4s cubic-bezier(.6,0,.9,.5);transform:translateX(120vw) rotate(25deg)}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
#veil.on{display:flex}
.dlg{background:var(--card);border:2px solid var(--ink);border-radius:8px;max-width:440px;width:100%;padding:20px 20px 16px;box-shadow:0 12px 0 rgba(0,0,0,.35);transition:transform .3s}
.dlg .q{font-size:22px;margin:0 0 6px}
.dlg .d{font-size:14px;color:var(--muted);margin:0 0 16px}
.dlg .d:empty{display:none}
.dlg .q{margin-bottom:16px !important}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.dlg button{font:600 15px ui-monospace,Menlo,monospace;border-radius:5px;padding:9px 16px;cursor:pointer;border:2px solid var(--ink);transition:font-size .3s,padding .3s}
.dlg .yes{background:var(--card);color:var(--ink)}
.dlg .no{background:var(--ink);color:var(--card)}
.dlg.crack{animation:crack .6s ease forwards}
@keyframes crack{30%{transform:rotate(-3deg) scale(1.03)}100%{transform:translateY(120vh) rotate(18deg)}}
#finale{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;pointer-events:none}
#finale.on{display:flex}
#cert{pointer-events:auto;background:var(--card);border:3px double var(--red);padding:24px 26px;max-width:520px;margin:16px;text-align:center;transform:scale(3) rotate(-8deg);opacity:0;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#finale.slam #cert{transform:rotate(-2deg);opacity:1}
#cert .stampword{font:800 clamp(30px,6vw,46px)/1 ui-monospace,Menlo,monospace;color:var(--red);letter-spacing:.06em;border:4px solid var(--red);display:inline-block;padding:6px 12px;margin-bottom:14px}
#cert p{margin:6px 0}
#cert button{margin-top:12px;font:600 14px ui-monospace,monospace;padding:8px 14px;border-radius:5px;border:2px solid var(--ink);background:var(--ink);color:var(--card);cursor:pointer}
.fall{animation:fall 1.4s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes fall{to{transform:translateY(130vh) rotate(var(--r,20deg));opacity:.6}}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01s !important;transition-duration:.01s !important}
  #bubble.shake{animation:none}
}
#tabmirror{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:5px 12px 6px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);max-width:min(420px,55vw);position:relative}
#tabmirror img{width:16px;height:16px;flex:none}
#tabmirror span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabmirror.flash{animation:flash .6s ease 2}
@keyframes flash{50%{background:var(--red);color:#fff}}
#tabhint{position:absolute;left:100%;top:4px;margin-left:10px;white-space:nowrap;color:var(--red);font-size:12px;opacity:0;transition:opacity .4s}
#tabhint.on{opacity:1}
#replay{max-width:560px;margin:10px auto 0;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);text-align:center;opacity:0;transition:opacity .6s;min-height:0}
#replay.on{opacity:1}
#replay b{color:var(--ink);font-weight:600}
#secrets{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
#face{cursor:pointer}
.flyaway{animation:flyaway 1.6s cubic-bezier(.5,0,.5,1) forwards}
@keyframes flyaway{35%{transform:scale(.25) translateY(-60vh)}50%{transform:scale(.25) translateY(-64vh) rotate(25deg)}100%{transform:none}}
.walkoff{transition:transform 2.2s ease-in !important;transform:translateX(120vw) rotate(8deg) !important}
</style>
</head>
<body>
<div id="app">
  <div class="tilt">
    <header class="mono piece">
      <span id="tabmirror"><img id="mirrorIcon" alt=""><span id="mirrorText">Don't Close This Tab</span><em id="tabhint">← your real tab title says this too ↑</em></span>
      <span>with me <b id="sTime">0s</b> · left <b id="sLeft">0</b> · visit <b id="sVisit">1</b></span>
    </header>

    <div id="faceWrap" class="piece">
      <svg id="face" viewBox="-160 -150 320 260" aria-hidden="true">
        <path class="tabshape piece" d="M-150,100 L-150,100 Q-128,100 -122,70 L-104,-110 Q-100,-140 -70,-140 L70,-140 Q100,-140 104,-110 L122,70 Q128,100 150,100 Z"/>
        <g id="bandages"></g>
        <g id="eyeL" transform="translate(-45,-45)">
          <circle class="eyeW" r="30"/><circle class="pupil" r="11"/>
          <path class="lid" d="M-32,0 A32,32 0 0 1 32,0 Z" transform="scale(1,0)"/>
        </g>
        <g id="eyeR" transform="translate(45,-45)">
          <circle class="eyeW" r="30"/><circle class="pupil" r="11"/>
          <path class="lid" d="M-32,0 A32,32 0 0 1 32,0 Z" transform="scale(1,0)"/>
        </g>
        <path id="browL" class="brow" d="M-70,-92 L-22,-92"/>
        <path id="browR" class="brow" d="M22,-92 L70,-92"/>
        <path id="mouth" class="mouth" d="M-30,30 Q0,48 30,30"/>
        <path class="sweat" id="sw1" d="M95,-80 q-8,14 0,18 q8,-4 0,-18z"/>
        <path class="sweat" id="sw2" d="M-98,-60 q-8,14 0,18 q8,-4 0,-18z"/>
        <path class="sweat" id="sw3" d="M100,-20 q-8,14 0,18 q8,-4 0,-18z"/>
      </svg>
      <div id="zzz">z z</div>
    </div>

    <div id="bubble" class="piece" aria-live="polite">…</div>
    <div id="sub" class="mono piece"></div>
    <div id="replay" aria-live="polite"></div>

    <div id="ways" class="piece"></div>
    <div id="secrets" class="mono piece"></div>
    <div id="bottom" class="mono piece">
      <span id="honest">Nothing here can stop you closing this tab.</span>
      <span><button id="logBtn" type="button">Departure log (0)</button> <button id="forget" type="button">Forget me</button></span>
    </div>
  </div>
</div>

<svg id="cobweb" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <g fill="none" stroke="#999" stroke-width=".25">
    <path d="M0,0 L22,0 M0,0 L0,22 M0,0 L18,12 M0,0 L10,20 M4,0 Q4,4 0,4 M9,0 Q8,8 0,9 M15,0 Q13,13 0,15"/>
    <path d="M100,0 L78,0 M100,0 L100,22 M100,0 L82,12 M100,0 L90,20 M96,0 Q96,4 100,4 M91,0 Q92,8 100,9 M85,0 Q87,13 100,15"/>
  </g>
</svg>

<button id="fake" type="button">Close tab ✕</button>

<aside id="drawer" aria-label="Departure log">
  <h2>Departure log <button id="logClose" type="button" style="float:right">close</button></h2>
  <ol id="log"></ol>
</aside>

<div id="veil"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dq">
  <p class="q" id="dq"></p><p class="d" id="dd"></p>
  <div class="row"><button class="yes" id="dYes" type="button"></button><button class="no" id="dNo" type="button"></button></div>
</div></div>

<div id="finale"><div id="cert">
  <div class="stampword">YOU MAY LEAVE</div>
  <p id="certStats"></p>
  <p>You always could. The X on the tab is real.</p>
  <button id="share" type="button">Copy my record</button>
</div></div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v = localStorage.getItem("dctt_"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("dctt_"+k, JSON.stringify(v)); }catch(e){} }
};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = isMac ? "⌘" : "Ctrl";
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];

function dur(ms){
  const s = Math.max(0, Math.round(ms/1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s/60);
  if (m < 60) return m + "m " + String(s%60).padStart(2,"0") + "s";
  const h = Math.floor(m/60);
  if (h < 48) return h + "h " + (m%60) + "m";
  return Math.floor(h/24) + " days";
}
function secs(ms){ const s = Math.max(1, Math.round(ms/1000)); return s + (s===1?" second":" seconds"); }
function words(ms){
  const s = Math.max(1, Math.round(ms/1000));
  if (s < 90) return secs(ms);
  const m = Math.round(s/60); if (m < 90) return m + " minutes";
  const h = Math.round(m/60); if (h < 48) return h + " hours";
  return Math.round(h/24) + " days";
}

// ---------- speech: short lines, never rushed ----------
const q = []; let busy = false;
function say(text, sub){
  q.push([text, sub||""]);
  while (q.length > 2) q.shift();
  pump();
}
function sayNow(text, sub){ // replace what's waiting; cut in only after the current line has had 1.6s
  q.length = 0; q.push([text, sub||""]);
  if (!busy) return pump();
  const wait = Math.max(0, 2600 - (Date.now() - shownAt));
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { busy = false; pump(); }, wait);
}
let holdTimer = null, shownAt = 0;
function pump(){
  if (busy || !q.length) return;
  busy = true;
  const [t, s] = q.shift();
  $("bubble").textContent = t; $("sub").textContent = s;
  shownAt = Date.now();
  const hold = Math.max(2600, (t.length + s.length) * 62);
  holdTimer = setTimeout(() => { busy = false; pump(); }, hold);
}

// ---------- face ----------
const MOODS = {
  calm:   {brow:[-92,-92], mouth:"M-30,30 Q0,48 30,30", pupil:11, sweat:0},
  happy:  {brow:[-98,-98], mouth:"M-36,24 Q0,62 36,24", pupil:12, sweat:0},
  worried:{brow:[-84,-98], mouth:"M-28,38 Q0,30 28,38", pupil:10, sweat:1},
  nervous:{brow:[-80,-100],mouth:"M-30,34 Q-15,24 0,34 Q15,44 30,34", pupil:8, sweat:2},
  panic:  {brow:[-76,-104],mouth:"M-20,34 Q0,4 20,34 Q0,62 -20,34", pupil:6, sweat:3},
  shock:  {brow:[-110,-110],mouth:"M-14,34 Q0,12 14,34 Q0,56 -14,34", pupil:5, sweat:1},
  sulk:   {brow:[-96,-86], mouth:"M-26,40 Q0,28 26,40", pupil:11, sweat:0},
  calmEnd:{brow:[-92,-92], mouth:"M-30,30 Q0,44 30,30", pupil:11, sweat:0}
};
let mood = "calm", moodLock = 0;
function setMood(m, lockMs){
  if (Date.now() < moodLock && !lockMs) return;
  mood = m; const M = MOODS[m];
  $("browL").setAttribute("d", `M-70,${M.brow[1]} L-22,${M.brow[0]}`);
  $("browR").setAttribute("d", `M22,${M.brow[0]} L70,${M.brow[1]}`);
  $("mouth").setAttribute("d", M.mouth);
  document.querySelectorAll("#face .pupil").forEach(p => p.setAttribute("r", M.pupil));
  ["sw1","sw2","sw3"].forEach((id,i) => $(id).style.opacity = i < M.sweat ? 1 : 0);
  if (lockMs) moodLock = Date.now() + lockMs;
}
function baseMood(){ // escalates with how many times you've tried to leave this visit
  if (ended) return "calmEnd";
  const n = attempts;
  return n < 3 ? "calm" : n < 6 ? "worried" : n < 10 ? "nervous" : "panic";
}
function settle(){ setMood(baseMood()); document.documentElement.style.setProperty("--mood", Math.min(5, attempts/3)); $("bubble").classList.toggle("shake", !reduce && attempts >= 10 && !ended); }
setInterval(() => { if (Date.now() >= moodLock) settle(); }, 500);

let look = {x:0, y:0};
function lookAt(x, y){ look = {x, y}; drawEyes(); }
function drawEyes(){
  const r = $("face").getBoundingClientRect();
  ["eyeL","eyeR"].forEach((id, i) => {
    const ex = r.left + r.width * (i ? 0.64 : 0.36), ey = r.top + r.height * 0.4;
    const dx = look.x - ex, dy = look.y - ey, d = Math.hypot(dx, dy) || 1, k = Math.min(15, d/12);
    const p = $(id).querySelector(".pupil");
    p.setAttribute("cx", dx/d*k); p.setAttribute("cy", dy/d*k);
  });
}
function lids(amount){ document.querySelectorAll("#face .lid").forEach(l => l.setAttribute("transform", `translate(0,-32) scale(1,${amount}) translate(0,32)`)); }
function blink(){ lids(1.05); setTimeout(() => lids(0), 140); }
(function blinker(){ setTimeout(() => { if (!asleep) blink(); blinker(); }, rnd(2500, 6000)); })();

// ---------- the ways ----------
const WAYS = [
  {id:"switch", name:"Switched tabs", hint:"go look at something else"},
  {id:"top",    name:"Went for the X", hint:"the X is up there somewhere"},
  {id:"away",   name:"Clicked another window", hint:"another window will do"},
  {id:"chase",  name:"Chased my button", hint:"there's a button here"},
  {id:"caught", name:"Caught my button", hint:"it gets tired"},
  {id:"esc",    name:"Pressed Escape", hint:"a key with a hopeful name"},
  {id:"mod",    name:"Pressed " + MOD, hint:"half of a shortcut"},
  {id:"shrink", name:"Squeezed me", hint:"make me smaller"},
  {id:"long",   name:"Left for 30s+", hint:"leave, and mean it"},
  {id:"reload", name:"Reloaded me", hint:"leave and come back at once"}
];
let found = store.get("found", []); if (!Array.isArray(found)) found = [];
function renderWays(fresh){
  const box = $("ways"); box.innerHTML = "";
  WAYS.forEach(w => {
    const d = document.createElement("div");
    const ok = found.includes(w.id);
    d.className = "way" + (ok ? " found" : "") + (fresh === w.id ? " stamp" : "");
    d.textContent = ok ? w.name : "? " + w.hint;
    box.appendChild(d);
  });
}
function find(id){
  if (found.includes(id)) return false;
  found.push(id); store.set("found", found); renderWays(id);
  if (found.length === WAYS.length) setTimeout(finale, 3200);
  return true;
}

// ---------- log ----------
let incidents = 0, attempts = 0;
let oldLog = store.get("log", []); if (!Array.isArray(oldLog)) oldLog = [];
const logBase = store.get("totalLog", 0);
function addLogLi(n, when, text){
  const li = document.createElement("li");
  li.innerHTML = '<span class="n"></span> <span class="t"></span><br><span class="d"></span>';
  li.querySelector(".n").textContent = "#" + n; li.querySelector(".t").textContent = when; li.querySelector(".d").textContent = text;
  $("log").prepend(li);
}
oldLog.forEach(e => addLogLi(e[0], e[1], e[2]));
function totalLog(){ return logBase + incidents; }
function log(text){
  incidents++;
  const when = new Date().toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit"});
  addLogLi(totalLog(), when, text);

      setMood("sulk", 4000);

      setTitle("🏳 you may leave");
    });
  }, 12500);
  setTimeout(() => { if (!document.hidden) say("You're still here.", "That's not on the list."); }, 70000);
}
$("share").onclick = () => {
  const logs = store.get("totalLog", 0) + incidents;
  const w = store.get("wrecks", 0);
  const txt = "I tried to leave a browser tab 10 different ways. It logged " + logs + " attempts" + (w ? " and fell apart " + (w === 1 ? "once" : w + " times") : "") + ". " + location.href.split("#")[0];
  const done = () => { $("share").textContent = "Copied"; setTimeout(() => $("share").textContent = "Copy my record", 2000); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => prompt("Copy this:", txt));
  else prompt("Copy this:", txt);
};
$("forget").onclick = () => {
  try { Object.keys(localStorage).filter(k => k.startsWith("dctt_")).forEach(k => localStorage.removeItem(k)); } catch(e){}
  found = []; secrets = []; oldLog = []; forgot = true; renderWays(); renderSecrets(); drawBandages(0);
  sayNow("Forgotten.", "Your visits and your list are gone. This visit's log stays until you close me.");
};

// ---------- memory between visits ----------
let forgot = false;
const prevTotal = store.get("totalMs", 0), prevLog = store.get("totalLog", 0);
function heartbeat(){ if (forgot) return; store.set("lastSeen", Date.now()); store.set("lastStay", Date.now() - t0); store.set("totalMs", prevTotal + Date.now() - t0); store.set("totalLog", prevLog + incidents); }
setInterval(heartbeat, 2000); addEventListener("pagehide", heartbeat);

// ---------- start ----------
// ---------- secrets ----------
const SECRETS = {poke:"Poked me", menu:"Right-clicked", sleep:"Let me fall asleep", copy:"Copied my words", all:"Selected everything"};
let secrets = store.get("secrets", []); if (!Array.isArray(secrets)) secrets = [];
function renderSecrets(){
  const n = secrets.length, t = Object.keys(SECRETS).length;
  $("secrets").textContent = n ? "Secret ways: " + n + " of " + t + " (" + secrets.map(k => SECRETS[k]).join(", ") + ")" : "There are also " + t + " secret ways. Nothing on this page tells you what they are.";
}
function secret(id){ if (secrets.includes(id)) return false; secrets.push(id); if (!forgot) store.set("secrets", secrets); renderSecrets(); log("Secret found: " + SECRETS[id] + "."); return true; }
$("face").addEventListener("click", () => {
  const n = nth("poke"); secret("poke");
  setMood(n > 6 ? "sulk" : "shock", 900); blink();
  const fw = $("faceWrap"); if (!reduce) fw.animate([{transform:"translateY(0)"},{transform:"translateY(-14px) rotate(-4deg)"},{transform:"translateY(0)"}], {duration:300});
  sayNow(esc(["Ow. Hi.", "That's my face.", "Still my face.", "You've poked me " + n + " times.", "Poke #" + n + ". I'm counting.", "This isn't leaving. This is just rude.", "Poke #" + n + "."], n), "");
});
document.addEventListener("contextmenu", () => {
  const n = nth("menu"); secret("menu");
  sayNow(esc(["Looking for “Close tab”?", "Still not in there.", "That menu won't help you."], n), "It's not in that menu. It's on the tab.");
});
renderSecrets();
renderWays();
placeFake(fake, innerWidth - 170, 64);
lookAt(innerWidth/2, innerHeight);
const reloads = store.get("reloads", 0);
function drawBandages(n){
  const g = $("bandages"); g.innerHTML = "";
  const spots = [[70,10,30],[-80,20,-25],[0,-120,10],[90,-110,40],[-95,-115,-35]];
  for (let i = 0; i < Math.min(n, spots.length); i++){
    const [x, y, r] = spots[i];
    g.insertAdjacentHTML("beforeend", `<g transform="translate(${x},${y}) rotate(${r})"><rect class="bandage" x="-22" y="-7" width="44" height="14" rx="5"/><rect class="bandage" x="-7" y="-22" width="14" height="44" rx="5"/></g>`);
  }
}
(function start(){
  let nav = ""; try { nav = (performance.getEntriesByType("navigation")[0] || {}).type || ""; } catch(e){}
  const lastSeen = store.get("lastSeen", 0), lastStay = store.get("lastStay", 0);
  if (nav === "reload" && visit > 1){
    const n = reloads + 1; store.set("reloads", n); drawBandages(n);
    attempt(); const first = find("reload"); log("Reloaded. Visit #" + visit + ".");
    setMood("shock", 2000);
    sayNow(first ? "Did you just reload me?" : "Reload #" + n + ".", first ? "That's leaving and coming back in one move. I got a bandage." : "Another bandage.");
    return;
  }
  drawBandages(reloads);
  if (visit > 1 && lastSeen){
    log("Last visit lasted " + dur(lastStay) + " and ended " + words(Date.now() - lastSeen) + " ago.");
    setMood("happy", 2500);
    sayNow("You came back!", "Last time you stayed " + words(lastStay) + ". That was " + words(Date.now() - lastSeen) + " ago.");
    if (found.length) say(found.length + " of 10 found.", "Your list is still here.");
    return;
  }
  say("Hi. I'm a tab.", "");
  say("Please don't close me.", "");
  say("You're going to try anyway.", "There are 10 ways I can notice. Find them all.");
})();
})();
</script>
</body>
